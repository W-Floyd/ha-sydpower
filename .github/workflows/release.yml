name: Build and publish sydpower wheel

# The library and the Home Assistant integration share one version and one tag.
# The integration pins its `sydpower` requirement to an asset on the same `v*`
# release it is distributed from (see custom_components/sydpower/manifest.json),
# so the wheel must be attached to that release for HACS installs to resolve.
on:
  push:
    tags:
      - "v*"
  # Allows building a wheel without tagging, to check packaging in isolation.
  workflow_dispatch:

permissions:
  contents: write # required to attach the wheel to the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tooling
        # bleak is a runtime dependency imported at module load, so the tests
        # cannot even be collected without it.
        run: python -m pip install --upgrade pip build pytest pytest-asyncio "bleak>=1.0.0"

      - name: Run tests
        working-directory: sydpower
        run: python -m pytest tests/ -q

      - name: Build wheel
        working-directory: sydpower
        run: python -m build --wheel --outdir dist

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: sydpower
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          echo "tag: $tag_version"
          echo "wheel: $wheel"
          # A tag that disagrees with pyproject.toml would publish an asset whose
          # filename does not match the URL the manifest pins.
          case "$wheel" in
            dist/sydpower-"$tag_version"-*.whl) echo "version matches" ;;
            *) echo "::error::tag $tag_version does not match built wheel $wheel"; exit 1 ;;
          esac

      - name: Verify the integration manifest agrees with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The manifest pins its sydpower requirement to an asset on this same
          # tag. If either the pin or the manifest version drifts, HACS installs
          # a snapshot whose requirement URL 404s or resolves to the wrong wheel.
          python - "$GITHUB_REF_NAME" <<'PY'
          import json, sys
          tag = sys.argv[1]
          version = tag.removeprefix("v")
          m = json.load(open("custom_components/sydpower/manifest.json"))
          errors = []
          if m["version"] != version:
              errors.append(f'manifest version {m["version"]!r} != tag version {version!r}')
          pin = next((r for r in m["requirements"] if r.startswith("sydpower @")), None)
          if pin is None:
              errors.append("no sydpower requirement pin found")
          else:
              expected = f"/releases/download/{tag}/sydpower-{version}-py3-none-any.whl"
              if not pin.endswith(expected):
                  errors.append(f"pin does not reference {expected}\n  pin: {pin}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      - name: Verify the wheel installs and imports
        working-directory: sydpower
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          # Run outside the source tree so the installed package is imported
          # rather than the working directory.
          cd /tmp && /tmp/verify/bin/python -c "
          import inspect
          from sydpower import SydpowerDevice, WRITABLE_HOLDING_REGISTERS
          from sydpower.catalog import get_device_params
          params = inspect.signature(SydpowerDevice.__init__).parameters
          assert 'client_factory' in params, 'client_factory missing'
          assert WRITABLE_HOLDING_REGISTERS, 'write allowlist empty'
          # product_catalog.json is package data; a wheel built without it would
          # silently fall back to wrong Modbus defaults.
          assert get_device_params(
              '00004380-0000-1000-8000-00805F9B34FB_POWER-8043'
          ), 'product catalog missing from wheel'
          print('wheel verified')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: sydpower-wheel
          path: sydpower/dist/*.whl

      - name: Extract release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > /tmp/extract_notes.py <<'PY'
          import pathlib, re, sys

          version = sys.argv[1].removeprefix("v")
          text = pathlib.Path("sydpower/CHANGES.md").read_text()
          # This version's section runs to the next version heading, or the end.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.M | re.S,
          )
          if match is None or not match.group(1).strip():
              sys.exit(1)
          print(match.group(1).strip())
          PY
          if python /tmp/extract_notes.py "$GITHUB_REF_NAME" > /tmp/notes.md; then
            echo "notes taken from CHANGES.md:"
            cat /tmp/notes.md
          else
            # Not fatal: the tag is already pushed, so refusing here would leave a
            # tag with no release. Fall back and flag it instead.
            echo "::warning::no CHANGES.md section for $GITHUB_REF_NAME; using generated notes"
            rm -f /tmp/notes.md
          fi

      - name: Publish the release with the wheel attached
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/notes.md ]; then
            notes=(--notes-file /tmp/notes.md)
          else
            notes=(--generate-notes)
          fi

          # Create the release if the tag was pushed without one; if it already
          # exists, refresh its notes so CHANGES.md stays the single source.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ -f /tmp/notes.md ] && gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" "${notes[@]}"
          fi

          gh release upload "$GITHUB_REF_NAME" sydpower/dist/*.whl \
            --repo "$GITHUB_REPOSITORY" --clobber
